services:
  bioinfo:
    build: .
    container_name: bioinfo-container
    volumes:
      - ./app:/app/
      - samples_data:/samples  # New volume for samples
    ports:
      - "8000:8000"
    tty: true
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000
    networks:
      - main-net
    environment:
      - DATABASE_URL=postgresql://postgres:password@db:5432/bioinfo
      - PYTHONPATH=/app  

  ngrok:
    image: ngrok/ngrok:latest
    ports:
      - "4040:4040"
    environment:
      - NGROK_AUTHTOKEN=2gHexvsy0HCeqqhDSmzy1c4nzlv_3aD5WkWJnYQXcgsEZKMmD
    command: http bioinfo-container:8000
    container_name: ngrok-container
    depends_on:
      - bioinfo
    networks:
      - main-net

  db:
    image: postgres:13
    container_name: postgres-container
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: bioinfo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - samples_data:/samples  # New volume for samples
    networks:
      - main-net

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "8080:80"
    depends_on:
      - db
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  main-net:
    driver: bridge

volumes:
  postgres_data:
  samples_data:  # New volume for samples