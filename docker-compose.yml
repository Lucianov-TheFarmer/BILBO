services:
  bioinfo:
    build:
      context: .
      target: runtime
    container_name: bioinfo-container
    volumes:
      - ./app:/app/
      - ./users:/users/
      - ./rag_data:/rag/
    ports:
      - "8890:8890"
    tty: true
    command: conda run --no-capture-output -n bioinfo uvicorn backend.main:app --host 0.0.0.0 --port 8890 --reload
    networks:
      - main-net
    environment:
      - DATABASE_URL=${DATABASE_URL:-}
      - PYTHONPATH=/app
      - OLLAMA_HOST=http://ollama:11434
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-bioinfo}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:8890,http://127.0.0.1:8890}
      - LLM_PRIMARY_MODEL=${LLM_PRIMARY_MODEL:-qwen3:14b}
      - LLM_FALLBACK_MODELS=${LLM_FALLBACK_MODELS:-qwen3:8b,qwen3:0.6b}
      - CLUSTER_INTERPRETATION_MODEL=${CLUSTER_INTERPRETATION_MODEL:-gemma3:4b}
      - RAG_LLM_MODEL=${RAG_LLM_MODEL:-gemma3:4b}
      - RAG_EMBEDDING_MODEL=${RAG_EMBEDDING_MODEL:-bge-m3:latest}
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_COLLECTION=${QDRANT_COLLECTION:-banco_literatura_bio}
      - BM25_METADATA_PATH=/rag/bm25_metadata.json
      - RAG_SNAPSHOT_URL=${RAG_SNAPSHOT_URL:-https://zenodo.org/api/records/21855338/files/QDrant_DB_BILBO_Plants.zip/content}
      - RAG_SNAPSHOT_MD5=${RAG_SNAPSHOT_MD5:-b06fb3793956cf5809f6c4091b8d91db}
      - RAG_SNAPSHOT_SHA256=${RAG_SNAPSHOT_SHA256:-a087b0601fcb14f7498b0cdb41573569f8584e47963d4aed4239725530790fa4}
      - RAG_BM25_SHA256=${RAG_BM25_SHA256:-8b4085db8fe788cc63426a78450204c28a7dd37c5cb3d1d32e7dc34e99f72882}
      - RAG_ROOT=/rag
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8890/health/live"]
      interval: 5s
      timeout: 3s
      retries: 15
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_healthy
      redis:
        condition: service_started
      qdrant:
        condition: service_started

  worker:
    build:
      context: .
      target: runtime
    container_name: bioinfo-worker
    command: conda run --no-capture-output -n bioinfo celery -A backend.tasks.celery_app.celery_app worker --loglevel=info --concurrency=1
    volumes:
      - ./app:/app/
      - ./users:/users/
      - ./rag_data:/rag/
    networks:
      - main-net
    environment:
      - DATABASE_URL=${DATABASE_URL:-}
      - PYTHONPATH=/app
      - BILBO_WANG_CPU_FRACTION=${BILBO_WANG_CPU_FRACTION:-0.50}
      - OMP_NUM_THREADS=1
      - OPENBLAS_NUM_THREADS=1
      - MKL_NUM_THREADS=1
      - NUMEXPR_NUM_THREADS=1
      - OLLAMA_HOST=http://ollama:11434
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-bioinfo}
      - LLM_PRIMARY_MODEL=${LLM_PRIMARY_MODEL:-qwen3:14b}
      - LLM_FALLBACK_MODELS=${LLM_FALLBACK_MODELS:-qwen3:8b,qwen3:0.6b}
      - CLUSTER_INTERPRETATION_MODEL=${CLUSTER_INTERPRETATION_MODEL:-gemma3:4b}
      - RAG_LLM_MODEL=${RAG_LLM_MODEL:-gemma3:4b}
      - RAG_EMBEDDING_MODEL=${RAG_EMBEDDING_MODEL:-bge-m3:latest}
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_COLLECTION=${QDRANT_COLLECTION:-banco_literatura_bio}
      - BM25_METADATA_PATH=/rag/bm25_metadata.json
      - RAG_SNAPSHOT_URL=${RAG_SNAPSHOT_URL:-https://zenodo.org/api/records/21855338/files/QDrant_DB_BILBO_Plants.zip/content}
      - RAG_SNAPSHOT_MD5=${RAG_SNAPSHOT_MD5:-b06fb3793956cf5809f6c4091b8d91db}
      - RAG_SNAPSHOT_SHA256=${RAG_SNAPSHOT_SHA256:-a087b0601fcb14f7498b0cdb41573569f8584e47963d4aed4239725530790fa4}
      - RAG_BM25_SHA256=${RAG_BM25_SHA256:-8b4085db8fe788cc63426a78450204c28a7dd37c5cb3d1d32e7dc34e99f72882}
      - RAG_ROOT=/rag
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      ollama:
        condition: service_healthy
      qdrant:
        condition: service_started

  cluster-rag:
    build:
      context: .
      target: runtime
    profiles: ["ai"]
    entrypoint: ["conda", "run", "--no-capture-output", "-n", "bioinfo", "python", "-m", "backend.scripts.cluster_rag_cli"]
    command: ["--help"]
    volumes:
      - ./app:/app/:ro
      - ${BILBO_AI_INPUT_DIR:-./ai_data/input}:/input:ro
      - ${BILBO_AI_OUTPUT_DIR:-./ai_data/output}:/output
      - ./rag_data:/rag/:ro
    networks:
      - main-net
    environment:
      - PYTHONPATH=/app
      - OLLAMA_HOST=http://ollama:11434
      - CLUSTER_INTERPRETATION_MODEL=${CLUSTER_INTERPRETATION_MODEL:-gemma4:e4b}
      - RAG_LLM_MODEL=${RAG_LLM_MODEL:-gemma4:e4b}
      - RAG_EMBEDDING_MODEL=${RAG_EMBEDDING_MODEL:-bge-m3:latest}
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_COLLECTION=${QDRANT_COLLECTION:-banco_literatura_bio}
      - BM25_METADATA_PATH=/rag/bm25_metadata.json
    depends_on:
      ollama:
        condition: service_healthy
      qdrant:
        condition: service_started

  rag-indexer:
    build:
      context: .
      target: runtime
    profiles: ["rag-index"]
    command: conda run --no-capture-output -n bioinfo python -m backend.pipeline_rag.index
    volumes:
      - ./app:/app/
      - ./rag_data:/rag/
      - ../Bilbo/artigos:/rag/articles:ro
    networks:
      - main-net
    environment:
      - PYTHONPATH=/app
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_EMBEDDING_URL=http://ollama:11434/api/embed
      - RAG_EMBEDDING_MODEL=${RAG_EMBEDDING_MODEL:-bge-m3:latest}
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_COLLECTION=${QDRANT_COLLECTION:-banco_literatura_bio}
      - BM25_METADATA_PATH=/rag/bm25_metadata.json
      - RAG_SNAPSHOT_URL=${RAG_SNAPSHOT_URL:-https://zenodo.org/api/records/21855338/files/QDrant_DB_BILBO_Plants.zip/content}
      - RAG_SNAPSHOT_MD5=${RAG_SNAPSHOT_MD5:-b06fb3793956cf5809f6c4091b8d91db}
      - RAG_SNAPSHOT_SHA256=${RAG_SNAPSHOT_SHA256:-a087b0601fcb14f7498b0cdb41573569f8584e47963d4aed4239725530790fa4}
      - RAG_BM25_SHA256=${RAG_BM25_SHA256:-8b4085db8fe788cc63426a78450204c28a7dd37c5cb3d1d32e7dc34e99f72882}
      - RAG_ROOT=/rag
      - RAG_ARTICLES_DIR=/rag/articles
      - RAG_ANNOTATE_LITERATURE_ENTITIES=${RAG_ANNOTATE_LITERATURE_ENTITIES:-false}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
    depends_on:
      qdrant:
        condition: service_started
      ollama:
        condition: service_healthy

  rag-admin:
    build:
      context: .
      target: runtime
    profiles: ["rag-admin"]
    entrypoint: ["conda", "run", "--no-capture-output", "-n", "bioinfo", "python", "-m", "backend.pipeline_rag.admin"]
    command: ["--help"]
    volumes:
      - ./app:/app/:ro
      - ./rag_data:/rag/
    networks:
      - main-net
    environment:
      - PYTHONPATH=/app
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_COLLECTION=${QDRANT_COLLECTION:-banco_literatura_bio}
      - QDRANT_API_KEY=${QDRANT_API_KEY:-}
      - BM25_METADATA_PATH=/rag/bm25_metadata.json
    depends_on:
      qdrant:
        condition: service_started

  rag-benchmark:
    build:
      context: .
      target: rag-benchmark
    profiles: ["rag-evaluation"]
    entrypoint: ["conda", "run", "--no-capture-output", "-n", "bioinfo", "python", "-m", "benchmarks.rag_evaluation.run_retrieval"]
    command: ["--help"]
    working_dir: /workspace
    mem_limit: 5g
    cpus: 4.0
    volumes:
      - ./app:/workspace/app:ro
      - ./benchmarks:/workspace/benchmarks
      - ./rag_data:/rag:ro
      - ../Bilbo:/prototype:ro
      - rag_benchmark_models:/root/.cache/huggingface
    networks:
      - main-net
    environment:
      - PYTHONPATH=/workspace
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_EMBEDDING_URL=http://ollama:11434/api/embed
      - RAG_EMBEDDING_MODEL=${RAG_EMBEDDING_MODEL:-bge-m3:latest}
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_COLLECTION=${QDRANT_COLLECTION:-banco_literatura_bio}
      - BM25_METADATA_PATH=/rag/bm25_metadata.json
      - MALLOC_ARENA_MAX=2
      - OMP_NUM_THREADS=4
      - MKL_NUM_THREADS=4
      - TOKENIZERS_PARALLELISM=false
    depends_on:
      ollama:
        condition: service_healthy
      qdrant:
        condition: service_started

  # Memory-safe interpretation runner. It deliberately uses a separate Ollama
  # service so `docker compose run` cannot start the 11 GiB CPU-oriented stack.
  rag-interpretations-safe:
    image: bilbo-rag-benchmark
    build:
      context: .
      target: rag-benchmark
    profiles: ["rag-interpretations-safe"]
    entrypoint: ["conda", "run", "--no-capture-output", "-n", "bioinfo", "python", "-m", "benchmarks.rag_evaluation.run_interpretations"]
    command: ["--help"]
    working_dir: /workspace
    mem_limit: 2g
    memswap_limit: 3g
    cpus: 2.0
    pids_limit: 256
    volumes:
      - ./app:/workspace/app:ro
      - ./benchmarks:/workspace/benchmarks
      - ./rag_data:/rag:ro
      - ../Bilbo:/prototype:ro
    network_mode: host
    environment:
      - PYTHONPATH=/workspace
      - OLLAMA_HOST=http://127.0.0.1:11436
      - OLLAMA_EMBEDDING_URL=http://127.0.0.1:11436/api/embed
      - RAG_EMBEDDING_MODEL=${RAG_EMBEDDING_MODEL:-bge-m3:latest}
      - QDRANT_URL=http://127.0.0.1:6333
      - QDRANT_COLLECTION=${QDRANT_COLLECTION:-banco_literatura_bio}
      - BM25_METADATA_PATH=/rag/bm25_metadata.json
      - MALLOC_ARENA_MAX=1
      - OMP_NUM_THREADS=2
      - MKL_NUM_THREADS=2
      - OPENBLAS_NUM_THREADS=2
      - NUMEXPR_NUM_THREADS=2
      - TOKENIZERS_PARALLELISM=false

  redis:
    image: redis:7-alpine
    container_name: redis-container
    ports:
      - "6379:6379"
    networks:
      - main-net

  qdrant:
    image: qdrant/qdrant:v1.15.4
    container_name: bilbo-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    mem_limit: 2g
    networks:
      - main-net

  ssh-server:
    image: lscr.io/linuxserver/openssh-server:latest
    container_name: ssh-container
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - SUDO_ACCESS=false
      - PASSWORD_ACCESS=true
      - USER_PASSWORD=${SSH_USER_PASSWORD:-bilbo}
      - USER_NAME=${SSH_USER_NAME:-bilbo}
    ports:
      - "2222:2222"
    volumes:
      - ssh_config:/config
    networks:
      - main-net

  ollama:
    build:
      context: .
      dockerfile: ollama.Dockerfile
    container_name: ollama-container
    ports:
      - "${OLLAMA_HOST_PORT:-11435}:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_CLUSTER_MODEL=${CLUSTER_INTERPRETATION_MODEL:-gemma3:4b}
      - OLLAMA_RAG_MODEL=${RAG_LLM_MODEL:-gemma3:4b}
      - OLLAMA_EMBEDDING_MODEL=${RAG_EMBEDDING_MODEL:-bge-m3:latest}
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_KEEP_ALIVE=30s
    mem_limit: 11g
    networks:
      - main-net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "ollama list | grep -Fq \"$$OLLAMA_CLUSTER_MODEL\" && ollama list | grep -Fq \"$$OLLAMA_RAG_MODEL\" && ollama list | grep -Fq \"$$OLLAMA_EMBEDDING_MODEL\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 30s

  db:
    image: postgres:13
    container_name: postgres-container
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-bioinfo}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-bioinfo}"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - main-net

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: "admin@admin.com"
      PGADMIN_DEFAULT_PASSWORD: "admin"
    ports:
      - "8080:80"
    depends_on:
      - db
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - main-net

networks:
  main-net:
    driver: bridge

volumes:
  postgres_data:
    name: bilbo_postgres_data
  users:
  ssh_config:
  ollama_data:
  qdrant_storage:
  rag_benchmark_models:
