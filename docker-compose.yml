services:
  bioinfo:
    build: .
    container_name: bioinfo-container
    volumes:
      - ./app:/app/
      - ./users:/users/
    ports:
      - "8000:8000"
    tty: true
    command: conda run --no-capture-output -n bioinfo uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - main-net
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - PYTHONPATH=/app
      - OLLAMA_HOST=http://ollama:11434
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - SECRET_KEY=${SECRET_KEY}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-bioinfo}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000}
      - LLM_PRIMARY_MODEL=${LLM_PRIMARY_MODEL:-qwen3:14b}
      - LLM_FALLBACK_MODELS=${LLM_FALLBACK_MODELS:-qwen3:8b,qwen3:0.6b}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live"]
      interval: 5s
      timeout: 3s
      retries: 15
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build: .
    container_name: bioinfo-worker
    command: conda run --no-capture-output -n bioinfo celery -A backend.tasks.celery_app.celery_app worker --loglevel=info --concurrency=1
    volumes:
      - ./app:/app/
      - ./users:/users/
    networks:
      - main-net
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - PYTHONPATH=/app
      - OLLAMA_HOST=http://ollama:11434
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - SECRET_KEY=${SECRET_KEY}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-bioinfo}
      - LLM_PRIMARY_MODEL=${LLM_PRIMARY_MODEL:-qwen3:14b}
      - LLM_FALLBACK_MODELS=${LLM_FALLBACK_MODELS:-qwen3:8b,qwen3:0.6b}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      ollama:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: redis-container
    ports:
      - "6379:6379"
    networks:
      - main-net

  ssh-server:
    image: lscr.io/linuxserver/openssh-server:latest
    container_name: ssh-container
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - SUDO_ACCESS=false
      - PASSWORD_ACCESS=true
      - USER_PASSWORD=${SSH_USER_PASSWORD}
      - USER_NAME=${SSH_USER_NAME:-bilbo}
    ports:
      - "2222:2222"
    volumes:
      - ssh_config:/config
    networks:
      - main-net

  ollama:
    build:
      context: .
      dockerfile: ollama.Dockerfile
    container_name: ollama-container
    ports:
      - "${OLLAMA_HOST_PORT:-11435}:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - main-net
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  db:
    image: postgres:13
    container_name: postgres-container
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-bioinfo}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-bioinfo}"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - main-net

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: "admin@admin.com"
      PGADMIN_DEFAULT_PASSWORD: "admin"
    ports:
      - "8080:80"
    depends_on:
      - db
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - main-net

networks:
  main-net:
    driver: bridge

volumes:
  postgres_data:
    name: bilbo_postgres_data
  users:
  ssh_config:
  ollama_data:
